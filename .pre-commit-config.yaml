repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]

  # US spelling plus ordinary typos.
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args:
          - --builtin=clear,rare,en-GB_to_en-US
          - --regex=[\w]+
          # fpr: false positive rate (sklearn.metrics.roc_curve).
          - --ignore-words-list=fpr
          # Base64 cell outputs in notebooks.
          - --ignore-regex=[A-Za-z0-9+/]{32,}={0,2}

  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
